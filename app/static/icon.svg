<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fhSpoolGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="fhHubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <!-- Outer Flange Rim -->
  <circle cx="50" cy="50" r="46" stroke="#334155" stroke-width="2.5" fill="#0b0f19"/>
  <!-- Filament Coil -->
  <circle cx="50" cy="50" r="39" stroke="url(#fhSpoolGrad)" stroke-width="9" fill="none"/>
  <!-- Spool Flange Window Cutouts -->
  <circle cx="50" cy="50" r="32" stroke="#1e293b" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
  <!-- Center Spool Hub -->
  <circle cx="50" cy="50" r="22" fill="url(#fhHubGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Center Arbor Hole -->
  <circle cx="50" cy="50" r="10" fill="#0b0f19" stroke="#6366f1" stroke-width="2.5"/>
  <!-- 3D Strand Indicator -->
  <path d="M 80 50 A 30 30 0 0 1 50 80" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>

version: '3.8'

services:
  filamenthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filamenthub
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:8085"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
